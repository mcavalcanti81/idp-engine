# Workflow reutilizável: o gatilho fino de cada repositório chama este arquivo.
# Toda a configuração vem do platform.yaml do repositório chamador (ADR-0006).
name: plat-idplabs

on:
  workflow_call: {}

permissions: {}

env:
  DAGGER_VERSION: "0.21.11"

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instala o Dagger
        run: curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR=/usr/local/bin sudo -E sh

      - name: check
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.base_ref }}
        run: |
          set -o pipefail
          ENGINE="github.com/mcavalcanti81/idp-engine@$(yq '.spec.engine.version' platform.yaml)"
          CHANGED="$(git diff --name-only "origin/${BASE}...HEAD")"
          dagger call -q -m "$ENGINE" check --source . \
            --branch "$BRANCH" --title "$TITLE" --changed "$CHANGED" \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: release-${{ github.repository }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Instala o Dagger
        run: curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR=/usr/local/bin sudo -E sh

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -o pipefail
          ENGINE="github.com/mcavalcanti81/idp-engine@$(yq '.spec.engine.version' platform.yaml)"
          dagger call -q -m "$ENGINE" release --source . \
            --repository "$REPOSITORY" --registry-user "$ACTOR" \
            --registry-token env://GH_TOKEN --git-token env://GH_TOKEN \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
